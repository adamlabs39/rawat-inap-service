version: "3.8"
services:
  rawat-inap-service:
    container_name: "rawat-inap-service"
    image: adameds/rawat-inap:dev
    ports:
      - 8085:8085
    networks:
      - rawatinap-network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASE: ${REDIS_DATABASE}

      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DIALECT: ${DB_DIALECT}
      DB_POOL: ${DB_POOL}
      SYNC_DB: ${SYNC_DB}
    restart: always
networks:
  rawatinap-network:
    driver: bridge